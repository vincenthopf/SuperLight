[package]
name = "superlight-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "superlight"
path = "src/main.rs"

[dependencies]
superlight-core = { path = "../superlight-core" }
superlight-ipc = { path = "../superlight-ipc" }
serde.workspace = true
serde_json.workspace = true
arc-swap = "=1.9.2"
crossbeam-channel = "=0.5.17"
ctrlc = "3.5"

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "=2.6.6", default-features = false, features = ["macos-shared-device"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "=2.6.6", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "=2.6.6", default-features = false, features = ["linux-native-basic-udev"] }
libc = "0.2"
evdev = "0.13"

[dev-dependencies]
tempfile.workspace = true
