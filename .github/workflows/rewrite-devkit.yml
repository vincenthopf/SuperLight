name: Rewrite verification environment

on:
  push:
    branches: [rewrite/rust-v3.6]
    paths: [.github/workflows/rewrite-devkit.yml]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare compiler and dependency sources
        shell: bash
        run: |
          rustup show
          rustup target add x86_64-pc-windows-msvc
          mkdir -p "$RUNNER_TEMP/verification/project/src" "$RUNNER_TEMP/verification/kit"
          cd "$RUNNER_TEMP/verification/project"
          printf 'fn main() {}\n' > src/main.rs
          cat > Cargo.toml <<'TOML'
          [package]
          name = "superlight-verification-dependencies"
          version = "0.0.0"
          edition = "2024"
          [dependencies]
          serde = { version = "1.0", features = ["derive"] }
          serde_json = { version = "1.0", features = ["preserve_order"] }
          tempfile = "=3.27.0"
          getrandom = "0.3"
          arc-swap = "=1.9.2"
          crossbeam-channel = "=0.5.17"
          ctrlc = "3.5"
          libc = "0.2"
          evdev = "0.13"
          eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
          image = { version = "0.25", default-features = false, features = ["png"] }
          [target.'cfg(target_os = "macos")'.dependencies]
          hidapi = { version = "=2.6.6", default-features = false, features = ["macos-shared-device"] }
          objc2 = "0.6"
          objc2-foundation = "0.3"
          objc2-app-kit = "0.3"
          [target.'cfg(windows)'.dependencies]
          hidapi = { version = "=2.6.6", default-features = false, features = ["windows-native"] }
          windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
          [target.'cfg(target_os = "linux")'.dependencies]
          hidapi = { version = "=2.6.6", default-features = false, features = ["linux-native-basic-udev"] }
          TOML
          cargo vendor --versioned-dirs ../kit/vendor > ../kit/vendor-config.toml
          cp Cargo.lock ../kit/resolved-dependencies.lock
          compiler="$(dirname "$(dirname "$(rustup which rustc)")")"
          tar -C "$compiler" -czf ../kit/rust-toolchain.tar.gz bin lib
          cd ../kit
          tar -czf ../dependencies.tar.gz vendor vendor-config.toml resolved-dependencies.lock
          mv rust-toolchain.tar.gz ../
      - uses: actions/upload-artifact@v4
        with:
          name: rewrite-offline-verification
          path: ${{ runner.temp }}/verification/*.tar.gz
          retention-days: 3
          compression-level: 0
