name: Rewrite workbench

on:
  push:
    branches: [rewrite/rust-v3.6]
    paths:
      - tools/rewrite_step.py
      - .github/workflows/rewrite-workbench.yml

permissions:
  contents: read

concurrency:
  group: rewrite-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.repository == 'vincenthopf/SuperLight'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python tools/rewrite_step.py
      - run: rustup show
      - run: cargo fmt --all
      - run: cargo generate-lockfile
      - name: Commit generated source and lockfile
        id: revision
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock rust-toolchain.toml crates tools docs packaging .github
          if ! git diff --cached --quiet; then
            git commit -m 'build: apply reviewed rewrite step and format Rust sources'
            git push origin HEAD:refs/heads/rewrite/rust-v3.6
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  test:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TomBadash/Mouser
          ref: 34d93f70b2a84e425698e0d3d748cae2c5d18911
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: python -m pip install hidapi PySide6 Pillow
      - name: Differential v3.6 contracts
        shell: bash
        run: |
          binary=target/debug/superlight-contract
          if [[ "$RUNNER_OS" == 'Windows' ]]; then binary="$binary.exe"; fi
          python compatibility/test_v36.py --baseline-dir reference --binary "$binary"
      - name: Service integration tests
        shell: bash
        run: |
          if [[ -f tools/test_service.py ]]; then python tools/test_service.py; fi
      - name: Archive build evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/revision.txt
          cargo metadata --locked --format-version 1 --no-deps > evidence/workspace.json
          cp Cargo.lock evidence/Cargo.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-${{ runner.os }}
          path: evidence/
          retention-days: 7
