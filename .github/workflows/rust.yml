name: Rust

on:
  push:
    branches: [master, rewrite/rust-v3.6]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**
      - compatibility/**
      - scripts/verify_headless.py
      - .github/workflows/rust.yml
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      CARGO_TERM_COLOR: never
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TomBadash/Mouser
          ref: 34d93f70b2a84e425698e0d3d748cae2c5d18911
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore compiler cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-${{ matrix.os }}-${{ runner.arch }}-
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-render0-dev xvfb
      - name: Compiler version
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test core, local control and native service
        run: cargo test --locked --workspace --no-default-features
      - name: Build complete desktop application
        run: cargo build --locked --workspace --bins
      - name: Test complete workspace
        run: cargo test --locked --workspace --all-targets
      - name: Static checks
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Install reference dependencies
        run: python -m pip install hidapi PySide6 Pillow
      - name: Differential v3.6 contracts
        shell: bash
        run: |
          binary=target/debug/superlight-contract
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="$binary.exe"; fi
          python compatibility/test_v36.py --baseline-dir reference --binary "$binary"
      - name: Verify service lifecycle without hardware
        shell: bash
        run: |
          binary=target/debug/superlight
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="$binary.exe"; fi
          python scripts/verify_headless.py --binary "$binary"
      - name: Render and close the settings preview
        if: runner.os == 'Linux'
        run: xvfb-run -a timeout 30 target/debug/superlight-ui --smoke-test
      - name: Build optimized executables
        run: cargo build --locked --release -p superlight-service -p superlight-ui --bins
      - name: Record binary sizes and dependencies
        shell: bash
        run: |
          mkdir -p evidence
          cargo tree --locked -p superlight-service > evidence/service-dependencies.txt
          cargo tree --locked -p superlight-ui > evidence/ui-dependencies.txt
          git rev-parse HEAD > evidence/commit.txt
          python - <<'PY'
          import hashlib, json, pathlib
          files = [path for path in pathlib.Path('target/release').iterdir() if path.name in ('superlight', 'superlight.exe', 'superlight-ui', 'superlight-ui.exe')]
          report = {path.name: {'bytes': path.stat().st_size, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()} for path in files}
          pathlib.Path('evidence/binaries.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
      - name: Upload optimized executables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: superlight-${{ matrix.os }}-${{ runner.arch }}
          path: |
            target/release/superlight
            target/release/superlight.exe
            target/release/superlight-ui
            target/release/superlight-ui.exe
            LICENSE
            evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Save compiler cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
