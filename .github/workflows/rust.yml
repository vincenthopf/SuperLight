name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Select pinned native Rust toolchain
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install
          rustup show active-toolchain
      - name: Validate workspace and tag version
        run: python scripts/package_release.py --check-version
      - name: Test release contracts
        run: python -W error -m unittest discover -s scripts -p 'test_*.py' -v
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - name: Build native macOS app
        run: bash macos/inspector/build.sh
      - name: Package and verify architecture
        run: python scripts/package_release.py --binaries target/native-macos --architecture arm64 --output dist
      - name: Verify extracted release
        run: |
          set -euo pipefail
          (cd dist && shasum -a 256 --check *.sha256)
          archives=(dist/*.zip)
          test "${#archives[@]}" -eq 1
          unzip -t "${archives[0]}"
          extracted=$(mktemp -d)
          ditto -x -k "${archives[0]}" "$extracted"
          app="$extracted/SuperLight.app"
          for name in superlight superlight-ui; do
            binary="$app/Contents/MacOS/$name"
            test -x "$binary"
            test "$(lipo -archs "$binary")" = arm64
            shasum -a 256 "$binary"
          done
          for name in LICENSE README.md AppIcon.icns mouse.png mouse_mx_anywhere_3s.png mx_vertical.png THIRD_PARTY_LICENSES/index.json; do
            test -s "$app/Contents/Resources/$name"
          done
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-aarch64-apple-darwin
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
