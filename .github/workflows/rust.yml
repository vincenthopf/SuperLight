name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
            architecture: arm64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            architecture: x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - name: Select native Rust toolchain
        run: |
          channel=$(python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('rust-toolchain.toml').read_text())['toolchain']['channel'])")
          toolchain="$channel-$TARGET"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - name: Validate tag version
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version']
          if os.environ['GITHUB_REF'].startswith('refs/tags/') and os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('Tag must match workspace version: v' + version)
          PY
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --lib
      - name: Build macOS app
        if: runner.os == 'macOS'
        run: bash macos/inspector/build.sh
      - name: Build Windows app
        if: runner.os == 'Windows'
        run: cargo build --locked --release -p superlight-service -p superlight-ui --bins --target "$TARGET"
      - name: Package and verify architecture
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then binaries=target/native-macos; else binaries="target/$TARGET/release"; fi
          python scripts/package_release.py --binaries "$binaries" --architecture "${{ matrix.architecture }}" --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
