name: Rust

on:
  push:
    branches: [rewrite/rust-v3.6]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**
      - compatibility/**
      - .github/workflows/rust.yml
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TomBadash/Mouser
          ref: 34d93f70b2a84e425698e0d3d748cae2c5d18911
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: rustup show
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build -p superlight-core --bin superlight-contract
      - name: Install reference dependencies
        run: python -m pip install hidapi PySide6 Pillow
      - name: Differential v3.6 contracts
        shell: bash
        run: |
          binary=target/debug/superlight-contract
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="$binary.exe"; fi
          python compatibility/test_v36.py --baseline-dir reference --binary "$binary"
