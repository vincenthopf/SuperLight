name: v3.6 baseline

on:
  push:
    branches: [rewrite/rust-v3.6]
    paths:
      - .github/workflows/rust-baseline.yml
      - compatibility/**
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: macos-14
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TomBadash/Mouser
          ref: 34d93f70b2a84e425698e0d3d748cae2c5d18911
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r reference/requirements.txt
      - working-directory: reference
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python compatibility/test_v36.py --baseline-dir reference
