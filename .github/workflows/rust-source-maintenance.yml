name: Rust source maintenance

on:
  push:
    branches: [rewrite/rust-v3.6]
    paths: [.github/workflows/rust-source-maintenance.yml]

permissions:
  contents: read

jobs:
  normalize:
    if: github.repository == 'vincenthopf/SuperLight' && github.ref == 'refs/heads/rewrite/rust-v3.6'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: rewrite/rust-v3.6
          fetch-depth: 0
      - name: Add acknowledged restoration and reconcile Linux persistence
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/superlight-core/src/session.rs')
          content = path.read_text()
          if 'pub fn restore_slot(' not in content:
              anchor = '    pub fn undivert_slot(&mut self, slot: usize) -> Result<(), Error> {'
              method = '''    pub fn restore_slot(&mut self, slot: usize, notify: &mut impl FnMut(Report)) -> Result<(), Error> {
                  let Some(divert) = self.diverts.get(slot).copied().flatten() else { return Ok(()); };
                  self.set_reporting(divert.cid, if divert.raw_xy { 0x22 } else { 0x02 }, notify)?;
                  self.diverts[slot] = None;
                  Ok(())
              }

          '''
              assert content.count(anchor) == 1
              content = content.replace(anchor, method + anchor)
          path.write_text(content)
          path = Path('crates/superlight-service/src/hardware.rs')
          content = path.read_text()
          before = 'self.session.undivert_slot(slot)?;'
          after = 'self.session.restore_slot(slot, &mut |report| self.pump.process(report))?;'
          if before in content:
              assert content.count(before) == 1
              content = content.replace(before, after)
          else:
              assert 'restore_slot' in content
          path.write_text(content)
          path = Path('crates/superlight-service/src/native/linux.rs')
          content = path.read_text()
          before = 'atomic_write(&path, content.as_bytes())\n'
          after = 'atomic_write(&path, content.as_bytes()).map(|_| ())\n'
          if before in content:
              assert content.count(before) == 1
              content = content.replace(before, after)
          else:
              assert 'atomic_write(&path, content.as_bytes()).map(|_| ())' in content
          path.write_text(content)
      - name: Format and verify portable regression suite
        shell: bash
        run: |
          set -euo pipefail
          rustup show
          cargo fmt --all
          cargo test --locked -p superlight-core
          cargo test --locked -p superlight-ipc
          cargo test --locked -p superlight-service --lib
      - name: Commit verified corrections
        shell: bash
        run: |
          set -euo pipefail
          git add Cargo.lock crates
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: acknowledge HID restoration and reconcile Linux login persistence'
            git push origin HEAD:refs/heads/rewrite/rust-v3.6
          fi
