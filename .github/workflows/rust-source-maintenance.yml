name: Rust source maintenance

on:
  push:
    branches: [rewrite/rust-v3.6]
    paths: [.github/workflows/rust-source-maintenance.yml]

permissions:
  contents: read

jobs:
  normalize:
    if: github.repository == 'vincenthopf/SuperLight' && github.ref == 'refs/heads/rewrite/rust-v3.6'
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: rewrite/rust-v3.6
          fetch-depth: 0
      - name: Remove unused bindings and simplify channel types
        shell: python
        run: |
          from pathlib import Path
          root = Path('crates/superlight-service/src')
          path = root / 'shared.rs'
          content = path.read_text()
          before = 'Result<(Arc<Self>, Receiver<QueuedInput>, Receiver<Command>), String>'
          if before in content:
              assert content.count(before) == 1
              content = content.replace(before, 'Result<SharedChannels, String>')
              content = content.replace('impl Shared {', 'pub type SharedChannels = (Arc<Shared>, Receiver<QueuedInput>, Receiver<Command>);\n\nimpl Shared {')
          else:
              assert 'Result<SharedChannels, String>' in content
          path.write_text(content)
          path = root / 'native/login.rs'
          content = path.read_text()
          anchor = 'pub fn xml(value: &str) -> String {'
          if '#[cfg(any(target_os = "macos", test))]' not in content:
              assert content.count(anchor) == 1
              content = content.replace(anchor, '#[cfg(any(target_os = "macos", test))]\n' + anchor)
          path.write_text(content)
          path = root / 'native/macos_ffi.rs'
          content = path.read_text()
          content = content.replace('    pub fn CFDictionaryGetValue(dictionary: Cf, key: Cf) -> Cf;\n', '')
          path.write_text(content)
          path = root / 'native/linux.rs'
          content = path.read_text()
          content = content.replace('desktop_exec(&executable)', 'desktop_exec(executable)')
          path.write_text(content)
          path = root / 'native/linux_frame.rs'
          content = path.read_text()
          before = '''                if let Some(source) = button_source(event.code()) {
                              if event.value() == 2 || hook.button(source, event.value() != 0) {
                                  continue;
                              }
                          }'''
          after = '''                if let Some(source) = button_source(event.code())
                              && (event.value() == 2 || hook.button(source, event.value() != 0)) {
                              continue;
                          }'''
          if before in content:
              assert content.count(before) == 1
              content = content.replace(before, after)
          else:
              assert '&& (event.value() == 2 || hook.button(source, event.value() != 0))' in content
          path.write_text(content)
      - name: Apply compiler-checked native simplifications
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
          cargo clippy --locked -p superlight-core -p superlight-ipc -p superlight-service --all-targets --fix --allow-dirty --allow-staged
          cargo fmt --all
          cargo clippy --locked -p superlight-core -p superlight-ipc -p superlight-service --all-targets -- -D warnings
          cargo test --locked -p superlight-core -p superlight-ipc -p superlight-service --all-targets
      - name: Commit verified corrections
        shell: bash
        run: |
          set -euo pipefail
          git add crates
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'refactor: remove unused platform bindings and satisfy native static checks'
            git push origin HEAD:refs/heads/rewrite/rust-v3.6
          fi
