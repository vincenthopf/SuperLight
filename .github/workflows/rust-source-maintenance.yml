name: Rust source maintenance

on:
  push:
    branches: [rewrite/rust-v3.6]
    paths: [.github/workflows/rust-source-maintenance.yml]

permissions:
  contents: read

jobs:
  normalize:
    if: github.repository == 'vincenthopf/SuperLight' && github.ref == 'refs/heads/rewrite/rust-v3.6'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: rewrite/rust-v3.6
          fetch-depth: 0
      - name: Check secure-input regression before implementation
        shell: bash
        run: |
          set -euo pipefail
          rustup show
          if ! grep -q 'pub fn set_input_restricted' crates/superlight-service/src/shared.rs; then
            if cargo test --locked -p superlight-service --test input_restrictions > /tmp/restrictions-before.log 2>&1; then
              cat /tmp/restrictions-before.log
              exit 1
            fi
            grep -q 'no method named.*set_input_restricted' /tmp/restrictions-before.log
            tail -35 /tmp/restrictions-before.log
          fi
      - name: Reconcile foreground restrictions and application-owned discovery
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/superlight-service/src/shared.rs')
          content = path.read_text()
          if 'pub fn set_input_restricted(' not in content:
              anchor = '    pub fn allowed(&self) -> bool {'
              method = '''    pub fn set_input_restricted(&self, restricted: bool) {
                  if self.restricted.swap(restricted, Ordering::AcqRel) != restricted {
                      if restricted { self.release_all(); }
                      self.generation.fetch_add(1, Ordering::AcqRel);
                      self.wake_hid();
                  }
              }

          '''
              assert content.count(anchor) == 1
              content = content.replace(anchor, method + anchor)
          path.write_text(content)
          path = Path('crates/superlight-service/src/runtime.rs')
          content = path.read_text()
          before = '''        if self.shared.restricted.swap(restricted, Ordering::AcqRel) != restricted && restricted {
                      self.shared.release_all();
                  }'''
          after = '        self.shared.set_input_restricted(restricted);'
          if before in content:
              assert content.count(before) == 1
              content = content.replace(before, after)
          else:
              assert after in content
          path.write_text(content)
          path = Path('crates/superlight-service/src/main.rs')
          content = path.read_text()
          anchor = '    superlight_service::run(options)'
          if 'HidApi::disable_device_discovery()' not in content:
              assert content.count(anchor) == 1
              content = content.replace(anchor, '    hidapi::HidApi::disable_device_discovery();\n' + anchor)
          path.write_text(content)
          path = Path('crates/superlight-service/src/hardware.rs')
          content = path.read_text()
          before = '            "IOKit shared device"'
          after = '            candidate.backend()'
          if before in content:
              assert content.count(before) == 1
              content = content.replace(before, after)
          else:
              assert after in content
          path.write_text(content)
      - name: Format and verify workspace without the renderer
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --locked --workspace --no-default-features
      - name: Commit verified corrections
        shell: bash
        run: |
          set -euo pipefail
          git add crates
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: reconfigure HID controls on secure-input transitions'
            git push origin HEAD:refs/heads/rewrite/rust-v3.6
          fi
