[workspace]
members = ["crates/superlight-core", "crates/superlight-ipc", "crates/superlight-service", "crates/superlight-ui", "crates/superlight-macos-bridge"]
resolver = "2"

[workspace.package]
version = "4.0.0-alpha.2"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/vincenthopf/SuperLight"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tempfile = "=3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2
